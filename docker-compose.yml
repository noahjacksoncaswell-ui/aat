version: "3.9"

# Local development stack for the AAT LOD Platform.
# Spins up PostgreSQL (with PostGIS available if the schema is extended to use it)
# and a MinIO instance as an S3-compatible object store stand-in for AWS S3.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: aat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aat
      POSTGRES_PASSWORD: aat_dev_password
      POSTGRES_DB: aat_lod
    ports:
      - "5432:5432"
    volumes:
      - aat_pg_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: aat-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aat_minio
      MINIO_ROOT_PASSWORD: aat_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aat_minio_data:/data

volumes:
  aat_pg_data:
  aat_minio_data:
